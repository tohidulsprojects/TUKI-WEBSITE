{% extends "base.html" %}
{% block title %}Create account — {{ site_name }}{% endblock %}
{% block content %}
<section class="auth-shell"><form method="post" class="auth-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="eyebrow">YOUR MARKETPLACE ACCOUNT</span><h1>Join TUKISHOP</h1><label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="100" required><label for="username">Username</label><input id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{2,39}" minlength="3" maxlength="40" required><label for="phone">Bangladesh mobile number</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required><label for="password">Password (10+ characters)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="200" required><label class="check-control"><input type="checkbox" name="remember" value="1"> Keep me logged in</label><button class="button button-full" type="submit">Create account</button><p class="auth-foot">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></form></section>
{% endblock %}
