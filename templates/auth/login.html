{% extends "base.html" %}
{% block title %}Log in — {{ site_name }}{% endblock %}
{% block content %}
<section class="auth-shell"><form method="post" class="auth-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="eyebrow">WELCOME BACK</span><h1>Log in to TUKISHOP</h1><p class="muted">Continue shopping, track orders, or manage your seller shop.</p><label for="identifier">Username or mobile number</label><input id="identifier" name="identifier" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><label class="check-control"><input type="checkbox" name="remember" value="1"> Keep me logged in</label><button class="button button-full" type="submit">Log in</button><p class="auth-foot">New to TUKISHOP? <a href="{{ url_for('auth.register') }}">Create an account</a></p></form></section>
{% endblock %}
