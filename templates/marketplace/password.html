{% extends "base.html" %}
{% block title %}Change password — {{ site_name }}{% endblock %}
{% block content %}
<section class="auth-shell"><form method="post" class="auth-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change password</h1><label for="current">Current password</label><input id="current" type="password" name="current_password" autocomplete="current-password" required><label for="new">New password (10+ characters)</label><input id="new" type="password" name="new_password" autocomplete="new-password" minlength="10" maxlength="200" required><button class="button button-full" type="submit">Update password</button></form></section>
{% endblock %}
